name: Build and release LaTeX

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out sources
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        id: dependencies
        shell: bash
        run: |
          mkdir -p build/ci
          sudo apt-get update 2>&1 | tee build/ci/dependencies.log
          sudo apt-get install --no-install-recommends -y \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended latexmk poppler-utils make python3 python3-openpyxl \
            2>&1 | tee -a build/ci/dependencies.log
      - name: Set UTC date version
        id: version
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          version="$(python3 scripts/version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Compile both parts and run all checks
        id: checks
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make ci
      - name: Package validated master release
        id: package
        if: >-
          github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: python3 scripts/package.py --require-pdfs 2>&1 | tee build/ci/package.log
      - name: Upload compiled PDFs
        id: pdfs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: he-ria26-${{ steps.version.outputs.version || github.run_id }}-pdfs
          path: |
            build/guidance/*.pdf
            build/submission/*.pdf
          if-no-files-found: warn
          retention-days: 30
      - name: Upload validated release assets
        id: release_assets
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: he-ria26-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload compilation logs and check reports
        id: logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: he-ria26-${{ steps.version.outputs.version || github.run_id }}-logs
          path: |
            build/ci/
            build/guidance/*.log
            build/guidance/*.blg
            build/submission/*.log
            build/submission/*.blg
            build/*-checks.json
            build/*counts.json
          if-no-files-found: warn
          retention-days: 30
      - name: Write check summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CI_STEPS_JSON: ${{ toJSON(steps) }}
          CI_PDF_URL: ${{ steps.pdfs.outputs.artifact-url }}
          CI_LOGS_URL: ${{ steps.logs.outputs.artifact-url }}
          CI_RELEASE_URL: ${{ steps.release_assets.outputs.artifact-url }}
          CI_CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
        shell: bash
        run: |
          if [ -f scripts/ci.py ]; then
            python3 scripts/ci.py summary
          else
            printf '# Horizon Europe template — CI\n\nSource checkout: **%s**. Checks could not start. See the workflow logs.\n' \
              "$CI_CHECKOUT_RESULT" >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download validated assets
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: he-ria26-${{ needs.build.outputs.version }}
          path: dist
      - name: Publish date-versioned release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Existing releases are never edited or overwritten, including reruns.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; keeping its existing assets."
            echo "action=preserved existing release" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api --silent "repos/$GH_REPO/git/ref/tags/$VERSION" 2>/dev/null; then
            echo "Tag $VERSION already exists without a release; refusing to reuse it."
            exit 1
          fi
          # The target SHA fixes the tag to exactly the source that was built.
          gh release create "$VERSION" dist/* \
            --target "$COMMIT_SHA" \
            --title "$VERSION" \
            --notes "Horizon Europe RIA template built at UTC version $VERSION from commit $COMMIT_SHA. Includes source, Part A and B PDFs with and without guidance, validation reports and SHA-256 hashes."
          echo "action=published" >> "$GITHUB_OUTPUT"
      - name: Write release summary
        if: always()
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DOWNLOAD_RESULT: ${{ steps.download.outcome }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
          RELEASE_ACTION: ${{ steps.publish.outputs.action }}
        shell: bash
        run: |
          {
            printf '## Master release\n\n| Stage | Result |\n| --- | --- |\n'
            printf '| Download validated assets | %s |\n' "$DOWNLOAD_RESULT"
            printf '| Publish release | %s |\n\n' "$PUBLISH_RESULT"
            if [ "$PUBLISH_RESULT" = success ]; then
              printf '✅ [%s](%s/%s/releases/tag/%s) — %s.\n' \
                "$VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$VERSION" "$RELEASE_ACTION"
            else
              printf '❌ Release was not published. See this job’s logs.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
