name: Build and release LaTeX

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended latexmk poppler-utils make python3
      - name: Set UTC date version
        id: version
        run: |
          version="$(python3 scripts/version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build both parts, validate and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make dist
      - name: Upload versioned assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: he-ria26-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download validated assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: he-ria26-${{ needs.build.outputs.version }}
          path: dist
      - name: Publish date-versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Existing releases are never edited or overwritten, including reruns.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; keeping its existing assets."
            exit 0
          fi
          if gh api --silent "repos/$GH_REPO/git/ref/tags/$VERSION" 2>/dev/null; then
            echo "Tag $VERSION already exists without a release; refusing to reuse it."
            exit 1
          fi
          # The target SHA fixes the tag to exactly the source that was built.
          gh release create "$VERSION" dist/* \
            --target "$COMMIT_SHA" \
            --title "$VERSION" \
            --notes "Horizon Europe RIA template built at UTC version $VERSION from commit $COMMIT_SHA. Includes source, Part A and B PDFs with and without guidance, validation reports and SHA-256 hashes."
